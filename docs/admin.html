<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whitelist admin</title>
<script>
  // Light or dark: inside the app, the app's choice (?theme=); on the web, the device's own setting (live).
  (() => {
    const asked = new URLSearchParams(location.search).get('theme');
    const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    const set = () => { document.documentElement.dataset.theme = asked === 'dark' || asked === 'light' ? asked : (mq && mq.matches ? 'dark' : 'light'); };
    set();
    if (!asked && mq && mq.addEventListener) mq.addEventListener('change', set);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE; --card: #FFFFFF; --ink: #1C2B2D; --ink2: #3E4B49; --muted: #5B6B69; --faint: #9AA5A3;
    --line: #E7E3DB; --line2: #EFECE5; --field: #D5D1C8;
    --accent: #1F5F55; --accent-dark: #16463F; --accent-soft: #E1EEEA; --mint: #7FD1A8;
    --amber: #FBEFD5; --amber-line: #EFD9A6; --amber-ink: #5C3D00;
    --red: #A33A2A; --red-soft: #F7E3DE;
    --display: 'Bricolage Grotesque', Figtree, system-ui, sans-serif;
    --body: Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--bg); }
  body { margin: 0; font: 16px/1.45 var(--body); color: var(--ink); background: var(--bg); -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  #app.sub { padding-bottom: 40px; }
  body.unsaved #app { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
  body.unsaved #app.sub { padding-bottom: 100px; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .brand .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #2E8B57; }
  .dot.off { background: #B4492F; }

  main { padding: 0 16px; }
  .title { padding: 10px 4px 12px; }
  .title h1 { margin: 0; font: 700 32px/1.15 var(--display); letter-spacing: -.01em; }
  .title p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 2px; margin: calc(8px + env(safe-area-inset-top, 0px)) 0 0 8px; font-weight: 600; text-decoration: none; background: none; border: 0; color: var(--accent); font-size: 15.5px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .h2row { display: flex; align-items: center; justify-content: space-between; margin: 10px 2px 0; }
  h2.sec { margin: 14px 4px 0; font-size: 15px; font-weight: 700; color: var(--ink2); }
  .h2row h2.sec { margin: 0; }
  .hint { margin: 0 4px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .card h3 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .who { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .who > span { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .av { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .av.big { width: 44px; height: 44px; font-size: 19px; }
  .av.grey { background: #EFEDE7; color: var(--ink2); }
  .muted { color: var(--muted); }
  .small { font-size: 13.5px; }
  .mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .quote { margin: 0; padding: 9px 12px; background: var(--bg); border-radius: 10px; font-size: 14.5px; color: var(--ink2); }
  .warn { margin: 0; padding: 9px 12px; background: var(--amber); border-radius: 10px; font-size: 14px; color: var(--amber-ink); }
  .line { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
  .done { color: var(--accent); font-weight: 700; display: flex; align-items: center; gap: 6px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12.5px; font-weight: 600; background: #EFEDE7; color: var(--ink2); white-space: nowrap; }
  .chip.teal { background: var(--accent-soft); color: var(--accent); }
  .chip.amber { background: var(--amber); color: #7A4F00; }
  .chip.red { background: var(--red-soft); color: #8E3322; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }

  .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn.p { background: var(--accent); color: #fff; }
  .btn.p:hover { background: var(--accent-dark); }
  .btn.s { background: #fff; border-color: #C9D9D4; color: var(--accent); font-weight: 600; }
  .btn.d { background: transparent; color: var(--red); font-weight: 600; padding: 0 12px; }
  .btn.dline { background: #fff; border-color: #E5C3BB; color: var(--red); font-weight: 600; }
  .btn.sm { min-height: 40px; padding: 0 14px; font-size: 14.5px; }
  .btn.wide { width: 100%; min-height: 50px; font-size: 16px; border-radius: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .acts .grow { flex: 1 1 auto; }

  .group { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line2); background: none; text-align: left; text-decoration: none; color: var(--ink); }
  .group > .row:last-child, .group > :last-child > .row { border-bottom: 0; }
  button.row:hover, a.row:hover { background: #FBFAF7; }
  .row .grow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .name { font-weight: 600; font-size: 15.5px; }
  .row .dom { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .count { color: var(--muted); font-size: 14px; }
  .row .chev { color: var(--faint); flex: none; display: flex; }
  .row .ic { color: var(--muted); display: flex; flex: none; }
  .tile { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .tile.big { width: 56px; height: 56px; border-radius: 16px; font-size: 24px; background: #fff; }

  .listchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
  .listchips::-webkit-scrollbar { display: none; }
  .lc { flex: none; min-height: 38px; padding: 0 14px; border-radius: 19px; font-size: 14px; font-weight: 600; white-space: nowrap; background: #fff; border: 1px solid var(--field); }
  .lc[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lc.add { width: 38px; padding: 0; border-style: dashed; border-color: #B9B4A9; background: transparent; display: grid; place-items: center; }
  .pick { display: inline-flex; align-items: center; gap: 5px; }
  .pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .tempcard { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--amber); border: 1px solid var(--amber-line); border-radius: 16px; color: var(--amber-ink); }
  .tempcard .grow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .tempcard b { overflow-wrap: anywhere; }
  .tempcard button { min-height: 38px; padding: 0 12px; border: 1px solid #D9B96E; border-radius: 10px; background: #fff; color: var(--amber-ink); font-weight: 600; font-size: 13.5px; flex: none; }
  a.tempcard { text-decoration: none; font-weight: 600; min-height: 52px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .flabel { font-size: 14px; font-weight: 600; color: var(--ink2); }
  .field, details.more, .stack > * { min-width: 0; }
  /* Inside <details>, the page's box-sizing isn't inherited (the browser's own wrapper is in between). */
  details *, details *::before, details *::after { box-sizing: border-box; }
  input[type=file] { max-width: 100%; }
  .inp { width: 100%; max-width: 100%; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid var(--field); border-radius: 12px; background: #fff; font-size: 16px; }
  textarea.inp { min-height: 150px; padding: 12px 14px; font-family: var(--mono); font-size: 14px; line-height: 1.6; resize: vertical; }
  .inp.bad { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  .inrow { display: flex; gap: 8px; }
  .inrow .inp { flex: 1 1 auto; min-width: 0; }

  .tg { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; }
  .group > .tg:last-child { border-bottom: 0; }
  .tg .grow { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
  .tg .t { font-weight: 600; font-size: 15.5px; }
  .tg .s { font-size: 13px; color: var(--muted); }
  .sw { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: #CFCBC2; position: relative; margin: 0; flex: none; cursor: pointer; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
  .sw:checked { background: var(--accent); }
  .sw:checked::after { left: 21px; }
  .radio { display: flex; align-items: flex-start; gap: 12px; min-height: 52px; padding: 12px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; }
  .group > .radio:last-child { border-bottom: 0; }
  .radio input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); cursor: pointer; min-height: 32px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #EFEDE7; }
  .seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 38px; height: 38px; border: 1px solid var(--field); border-radius: 10px; background: #fff; font-size: 18px; }
  .stepper span { min-width: 72px; text-align: center; font-weight: 600; }

  .frow { display: grid; grid-template-columns: 7.5rem 1fr; align-items: center; gap: 8px; }
  .panel { border-top: 1px solid var(--line2); margin-top: 4px; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }

  /* Scroll wheels: hours 0-24, minutes 0-55 */
  .wheels { position: relative; display: flex; justify-content: center; gap: 1.8rem; height: 180px; margin: .2rem 0 .4rem; user-select: none; -webkit-user-select: none; }
  .wheel-col { display: flex; align-items: center; gap: .5rem; z-index: 1; }
  .wheel-col span { color: var(--muted); font-size: .9rem; width: 2.6rem; }
  .wheel { height: 180px; width: 3.6rem; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; outline: none;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel div { height: 36px; line-height: 36px; text-align: center; font-size: 1.35rem; scroll-snap-align: center; color: #8AA39F; font-variant-numeric: tabular-nums; cursor: pointer; }
  .wheel div.sel { color: var(--ink); font-weight: 600; }
  .wheel .pad { height: 72px; scroll-snap-align: none; cursor: default; }
  .wheel:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 8px; }
  .wheel-band { position: absolute; left: 50%; transform: translateX(-50%); width: min(15rem, 100%); top: 72px; height: 36px; border-radius: 8px; background: rgba(31, 95, 85, .09); border: 1px solid var(--line); pointer-events: none; }

  /* Bottom bars */
  #tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(560px, 100%); z-index: 20;
    display: flex; justify-content: space-around; align-items: flex-start; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    background: #fff; border-top: 1px solid #E3E0D8; }
  #tabs button { position: relative; width: 84px; min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  #tabs .pill { position: relative; display: grid; place-items: center; width: 56px; height: 30px; border-radius: 15px; }
  #tabs button[aria-current="page"] { color: var(--accent); }
  #tabs button[aria-current="page"] .pill { background: var(--accent-soft); }
  #tabs .badge { position: absolute; top: -4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #B4492F; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  #savebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(536px, calc(100% - 24px)); z-index: 21;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 16px; background: #1C2B2D; color: #fff; box-shadow: 0 6px 18px rgba(28,43,45,.25); }
  #app.sub ~ #savebar { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #savebar span { font-size: 14.5px; font-weight: 500; }
  #savebar button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; font-weight: 700; }
  #savebar .undo { background: transparent; color: #CFE3DD; font-weight: 600; }
  #savebar .save { background: var(--mint); color: #0E2A25; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100% - 24px)); z-index: 30;
    padding: 12px 16px; border-radius: 14px; background: #1C2B2D; color: #fff; font-size: 14.5px; box-shadow: 0 6px 18px rgba(28,43,45,.25); cursor: pointer; }
  #toast.error { background: #7A2A1D; }
  .empty { text-align: center; padding: 28px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  /* Small screens (e.g. 2.8-inch phones, about 240px wide) */
  @media (max-width: 340px) {
    body { font-size: 15px; }
    main { padding: 0 8px; }
    .top { padding-left: 12px; padding-right: 12px; }
    .title { padding: 6px 2px 8px; }
    .title h1 { font-size: 24px; }
    h1[style] { font-size: 22px !important; }
    .card { padding: 12px; border-radius: 14px; }
    .card h3 { font-size: 16.5px; }
    .btn { padding: 0 12px; font-size: 14px; }
    .row { gap: 10px; padding: 10px 10px; }
    .tile { width: 34px; height: 34px; font-size: 15px; }
    .tile.big { width: 44px; height: 44px; font-size: 20px; }
    .tg { padding: 10px; gap: 10px; }
    .tg:has(.stepper) { flex-wrap: wrap; }          /* rows with − / + wrap; switches stay beside their text */
    .who { flex-wrap: wrap; row-gap: 6px; }
    .who > span { flex-wrap: wrap; column-gap: 6px; row-gap: 0; }
    .who > span > .small { font-size: 12.5px; white-space: nowrap; }
    .tg .t { font-size: 14.5px; }
    .stepper span { min-width: 56px; }
    .seg button { font-size: 12.5px; min-height: 38px; padding: 0 2px; }
    .frow { grid-template-columns: 1fr; gap: 4px; }
    .wheels { gap: .6rem; }
    .wheel { width: 3rem; }
    .wheel-col span { width: 1.9rem; font-size: .8rem; }
    #tabs { padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px)); }
    #tabs button { flex: 1 1 0; width: auto; min-width: 0; font-size: 10.5px; }
    #tabs .pill { width: 44px; height: 28px; }
    #savebar { padding: 6px 6px 6px 10px; gap: 6px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    #savebar span { font-size: 12.5px; }
    #savebar button { padding: 0 10px; }
    body.unsaved #app { padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px)); }
    #app { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  }
  details.more > summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 6px 4px; list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }

  /* ---------- Dark ----------
     Inside the app: the app's choice (?theme=dark). On the web: the device's own setting. */
  :root[data-theme="dark"] { --bg: #1F2B2C; --card: #304041; --ink: #ECF2F0; --ink2: #D2DDDA; --muted: #AEBFBB; --faint: #8EA19D;
    --line: #3D4E4F; --line2: #364748; --field: #4A5D5E; --accent: #3D8F7E; --accent-dark: #347A6C; --accent-soft: #2C4A44;
    --mint: #9BE3C2; --amber: #4A3B20; --amber-line: #6A5530; --amber-ink: #F5D08A; --red: #F7B4A7; --red-soft: #4A2C28;
    color-scheme: dark; }
  :root[data-theme="dark"] a, :root[data-theme="dark"] .back, :root[data-theme="dark"] .done, :root[data-theme="dark"] details.more > summary, :root[data-theme="dark"] .chip.teal, :root[data-theme="dark"] .av, :root[data-theme="dark"] .pick[aria-pressed="true"],
  :root[data-theme="dark"] #tabs button[aria-current="page"] { color: var(--mint); }
  :root[data-theme="dark"] .btn.s, :root[data-theme="dark"] .lc, :root[data-theme="dark"] .inp, :root[data-theme="dark"] .stepper button, :root[data-theme="dark"] .tile.big, :root[data-theme="dark"] .tempcard button, :root[data-theme="dark"] .btn.dline, :root[data-theme="dark"] #tabs { background: var(--card); color: var(--ink); }
  :root[data-theme="dark"] .btn.s { border-color: var(--field); color: var(--mint); }
  :root[data-theme="dark"] .btn.dline { border-color: #6B3A33; color: var(--red); }
  :root[data-theme="dark"] .lc[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--mint); }
  :root[data-theme="dark"] .lc.add { background: transparent; border-color: #56696A; }
  :root[data-theme="dark"] .seg, :root[data-theme="dark"] .chip, :root[data-theme="dark"] .av.grey { background: #364748; }
  :root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #435657; color: var(--ink); }
  :root[data-theme="dark"] .chip.amber { color: var(--amber-ink); }
  :root[data-theme="dark"] .chip.red { color: var(--red); }
  :root[data-theme="dark"] .sw { background: #56696A; }
  :root[data-theme="dark"] .sw:checked { background: var(--accent); }
  :root[data-theme="dark"] .wheel div { color: #8EA19D; }
  :root[data-theme="dark"] .wheel div.sel { color: var(--ink); }
  :root[data-theme="dark"] .wheel-band { background: rgba(127, 209, 168, .10); }
  :root[data-theme="dark"] #tabs { border-top-color: var(--line); }
  :root[data-theme="dark"] button.row:hover, :root[data-theme="dark"] a.row:hover { background: #344546; }
  :root[data-theme="dark"] .tile { background: #273536; color: var(--mint) !important; }
  :root[data-theme="dark"] .tempcard { color: var(--amber-ink); }
  :root[data-theme="dark"] .tempcard button { border-color: #5A4724; color: var(--amber-ink); }
  :root[data-theme="dark"] .quote { background: #273536; }

  S.D = d ? d.data : { default: ['public'], devices: {} };
  if (!Array.isArray(S.D.default)) S.D.default = ['public'];
  if (!S.D.devices) S.D.devices = {};
  if (!S.D.archived) S.D.archived = {};
  S.devicesSha = d ? d.sha : null;
  S.devDirty = false;
}

  const f = await getJson(listPathOf(name));

// ---------- saving ----------
async function saveAll() {
  $('saveBtn').disabled = true;
  try {
    if (S.listDirty) {
      const out = fromModel(S.L);
      if (out.error) { say(out.error, true); return; }
      S.listSha = await putJson(listPathOf(S.current), out.data, S.listSha, `Update ${S.current} list from admin page`);
      S.L = toModel(out.data);
      S.listDirty = false;
    }
    if (S.devDirty) {
      S.devicesSha = await putJson('devices.json', S.D, S.devicesSha, 'Update phones and settings');
      S.devDirty = false;
    }
    say('Saved. It\'s published for the phones within a minute or two, and they pick it up within a few minutes.');
    render();
  } catch (e) { say(e.message, true); }
  finally { $('saveBtn').disabled = false; renderSaveBar(); }
}
async function undoAll() {
  if (!confirm('Undo all unsaved changes?')) return;
  try {
    if (S.listDirty) await openList(S.current);
    if (S.devDirty) await loadDevices();
    say('Changes undone.');
    render();
  } catch (e) { say(e.message, true); }
}
function renderSaveBar() {
  const n = (S.listDirty ? 1 : 0) + (S.devDirty ? 1 : 0);
  $('savebar').hidden = !n || !S.connected;
  document.body.classList.toggle('unsaved', !!n && S.connected);
  $('saveText').textContent = S.listDirty && S.devDirty ? `Changes to ${listLabel(S.current)} and phones not saved yet`

async function switchList(name) {

  if (S.listDirty && !confirm(`Discard unsaved changes to ${listLabel(S.current)}?`)) return;

function newList() {
  if (S.listDirty && !confirm(`Discard unsaved changes to ${listLabel(S.current)}?`)) return;
  const raw = prompt('Name for the new list, e.g. year-5 or weekend.\n(List names can be seen publicly, so don\'t use full names.)', '');
  if (raw === null) return;
  const name = raw.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30);
  if (!name) return say('Use letters and numbers for the list name.', true);

  S.current = name; S.listSha = null;

async function deleteList() {
  const name = S.current;
  if (name === 'public') return;
  const users = phonesUsing(name);
  if (!confirm(`Delete the ${listLabel(name)} list?` + (users.length ? ` ${users.join(', ')} will stop using it.` : ''))) return;
  try {
    if (S.listSha) await deleteFile(listPathOf(name), S.listSha, `Delete list ${name}`);
    Object.values(S.D.devices).forEach(d => { d.lists = (d.lists || []).filter(l => l !== name); if (d.requestsTo === name) delete d.requestsTo; });
    S.D.default = S.D.default.filter(l => l !== name);
    S.devicesSha = await putJson('devices.json', S.D, S.devicesSha, `Remove list ${name} from phones`);
    S.devDirty = false;
    S.lists = S.lists.filter(l => l !== name);
    await openList('public');
    S.sub = null; render();
    say(`Deleted the ${listLabel(name)} list.`);
  } catch (e) { say(e.message, true); }
}

// ---------- scroll wheels (hours 0-24, minutes 0-55 in steps of 5) ----------
// makePicker(host, minutes, onChange) -> { get(), set(min), sync() }. Wheels only scroll while visible.
const ROW = 36;
function makePicker(host, startMinutes, onChange) {
  host.innerHTML = '<div class="wheels"><div class="wheel-band"></div>' +
    '<div class="wheel-col"><div class="wheel" tabindex="0" role="listbox" aria-label="Hours"></div><span>hours</span></div>' +
    '<div class="wheel-col"><div class="wheel" tabindex="0" role="listbox" aria-label="Minutes"></div><span>min</span></div></div>';
  const [hEl, mEl] = host.querySelectorAll('.wheel');
  const cols = [{ el: hEl, values: Array.from({ length: 25 }, (_, i) => i), value: 0 },
                { el: mEl, values: Array.from({ length: 12 }, (_, i) => i * 5), value: 0 }];
  const total = () => cols[0].value * 60 + cols[1].value;
  const changed = () => onChange && onChange(total());
  const mark = (c, idx) => c.el.querySelectorAll('[data-v]').forEach((d, i) => { d.classList.toggle('sel', i === idx); d.setAttribute('aria-selected', i === idx); });
  function setCol(c, v, smooth) {
    let idx = c.values.indexOf(v);
    if (idx < 0) idx = c.values.reduce((b, x, i) => Math.abs(x - v) < Math.abs(c.values[b] - v) ? i : b, 0);
    c.value = c.values[idx];
    c.el.scrollTo({ top: idx * ROW, behavior: smooth ? 'smooth' : 'auto' });
    mark(c, idx);
  }
  cols.forEach(c => {
    c.el.innerHTML = '<div class="pad"></div>' + c.values.map(v => `<div data-v="${v}" role="option">${String(v).padStart(2, '0')}</div>`).join('') + '<div class="pad"></div>';
    let settle;
    c.el.addEventListener('scroll', () => {
      clearTimeout(settle);
      settle = setTimeout(() => {
        const idx = Math.max(0, Math.min(c.values.length - 1, Math.round(c.el.scrollTop / ROW)));
        const moved = c.values[idx] !== c.value;
        c.value = c.values[idx]; mark(c, idx);
        if (moved) changed();
      }, 90);
    });
    c.el.addEventListener('click', e => { const d = e.target.closest('[data-v]'); if (d) { setCol(c, Number(d.dataset.v), true); changed(); } });
    c.el.addEventListener('keydown', e => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const idx = c.values.indexOf(c.value) + (e.key === 'ArrowDown' ? 1 : -1);
      setCol(c, c.values[Math.max(0, Math.min(c.values.length - 1, idx))], true); changed();
    });
  });
  const picker = {
    get: total,
    set(min, smooth) {
      min = Math.max(0, Math.min(24 * 60 + 55, Math.round(min)));
      setCol(cols[0], Math.floor(min / 60), smooth);
      setCol(cols[1], Math.min(55, Math.round((min % 60) / 5) * 5), smooth);
      changed();
    },
    sync() { setCol(cols[0], cols[0].value, false); setCol(cols[1], cols[1].value, false); }
  };
  picker.set(startMinutes);
  requestAnimationFrame(() => picker.sync());
  return picker;
}

// ---------- spreadsheets ----------
function parseDelimited(text) {
  const first = text.split('\n')[0];
  const delim = text.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"' && cell === '') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows;
}
const NO = ['no', 'n', 'false', '0', 'off', 'hidden', 'hide', 'nee', 'nein', 'non'];
function rowsToSites(rows) {
  rows = rows.map(r => r.map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  if (!rows.length) return { sites: [], bad: [] };
  let col = { domain: 0, name: 1, home: 2, url: 3, subs: 4, pages: 5, media: 6 };
  const head = rows[0].map(x => x.toLowerCase());
  const find = (words, skip = []) => {
    for (const w of words) { const i = head.findIndex((x, n) => x.includes(w) && !skip.includes(n)); if (i >= 0) return i; }
    return -1;
  };
  const subCols = head.map((x, n) => x.includes('sub') || /photo|video|media/.test(x) ? n : -1).filter(n => n >= 0);
  const d = find(['domain', 'website', 'address', 'web', 'url', 'site'], subCols);
  if (d >= 0 && !normalize(rows[0][d])) {               // first row is a header
    const name = find(['name', 'title', 'label'], [d]);
    const subs = find(['subdomain', 'sub'], [d, name]);
    // "no photos or videos" (or "media"): both; "no photos": photos only; "no videos": videos only.
    const colWhere = test => head.findIndex((x, n) => test(x) && ![d, name, subs].includes(n));
    const both = colWhere(x => (/photo/.test(x) && /video/.test(x)) || /media/.test(x));
    const photoCol = colWhere(x => /photo/.test(x) && !/video/.test(x));
    const videoCol = colWhere(x => /video/.test(x) && !/photo/.test(x));
    const soundCol = colWhere(x => /sound|audio/.test(x));
    const media = [both, photoCol, videoCol, soundCol].find(n => n >= 0) ?? -1;
    const pages = find(['pages', 'page', 'only'], [d, name, subs, both, photoCol, videoCol, soundCol]);
    const home = find(['home', 'tile', 'show'], [d, name, subs, pages, both, photoCol, videoCol, soundCol]);
    const url = find(['opens', 'start', 'link', 'url'], [d, name, home, subs, pages, both, photoCol, videoCol, soundCol]);
    col = { domain: d, name, home, url, subs, pages, both, photoCol, videoCol, soundCol };
    rows = rows.slice(1);
  }
  const sites = [], bad = [];
  rows.forEach(r => {
    const raw = r[col.domain] || '';
    const domain = normalize(raw);
    if (!domain) { if (raw) bad.push(raw); return; }
    const homeCell = col.home >= 0 ? (r[col.home] || '').toLowerCase() : '';
    let url = col.url >= 0 ? (r[col.url] || '') : '';
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!url && /^(https?:\/\/)?[^/\s]+\/[^\s]+/i.test(raw)) url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
    const subsCell = col.subs >= 0 ? (r[col.subs] || '').toLowerCase() : '';
    const pages = col.pages >= 0 ? (r[col.pages] || '').split(/\s+/).filter(Boolean) : [];
    const yes = n => n !== undefined && n >= 0 && ['yes', 'y', 'true', '1', 'x', 'on'].includes((r[n] || '').toLowerCase().trim());
    sites.push({ domain, name: col.name >= 0 ? (r[col.name] || '') : '', url, home: !NO.includes(homeCell),
      subdomains: !NO.includes(subsCell), pages, noPhotos: yes(col.both) || yes(col.photoCol), noVideos: yes(col.both) || yes(col.videoCol), noSound: yes(col.both) || yes(col.soundCol), passThrough: false });
  });
  return { sites, bad };
}
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = () => fail(new Error('Couldn\'t load the Excel reader. Save the sheet as CSV instead.'));
    document.head.append(sc);
  });
}
function exportCsv() {
  const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  const lines = ['domain,name,home page,tile opens,subdomains,only these pages,no photos,no videos,no sound'];
  S.L.sites.forEach(s => {
    if (!s.domain.trim()) return;
    lines.push([s.domain.trim(), s.name.trim(), s.home ? 'yes' : 'no', s.url.trim(), s.subdomains ? 'yes' : 'no', s.pages.join(' '),
      s.noPhotos ? 'yes' : 'no', s.noVideos ? 'yes' : 'no', s.noSound ? 'yes' : 'no'].map(q).join(','));
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n') + '\r\n'], { type: 'text/csv' }));
  a.download = `${S.current}-sites.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- approval PIN (typed on a phone to approve a request on the spot) ----------
// Stored in devices.json only as a salted PBKDF2-SHA256 hash, the same way GitHub's check computes it.
async function hashApprovalPin(pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, 256);
  return { salt: u8b64(salt), hash: u8b64(new Uint8Array(bits)), iter: 150000 };
}
function approvalPinScreen() {
  const sub = S.sub, all = sub.scope === 'all';
  const d = all ? null : S.D.devices[sub.scope];

  const had = all ? !!S.D.approvalPin : !!(d && d.approvalPin && typeof d.approvalPin === 'object');
  const done = () => all ? back() : open({ name: 'phone', id: sub.scope });   // back to where it was opened from
  const field = (id, label) => h('div', { class: 'field' }, h('label', { for: id }, label),
    h('input', { class: 'inp', id, type: 'password', inputmode: 'numeric', autocomplete: 'off', maxlength: '8', placeholder: '4 to 8 digits', style: 'max-width:12rem;font-size:20px;letter-spacing:.2em' }));
  const saveBtn = h('button', { type: 'button', class: 'btn p wide', id: 'apSave' }, had ? 'Change the PIN' : 'Set the PIN');
  saveBtn.onclick = async () => {
    const a = $('apNew').value, b = $('apAgain').value;
    if (!/^\d{4,8}$/.test(a)) return say('The PIN needs 4 to 8 digits.', true);
    if (a !== b) { $('apAgain').value = ''; return say('The two PINs don\'t match. Type it again.', true); }
    saveBtn.disabled = true;
    const hashed = await hashApprovalPin(a);
    if (all) S.D.approvalPin = hashed; else d.approvalPin = hashed;
    markDevices(); done();
    say(`Approval PIN ${had ? 'changed' : 'set'} for ${who}. Tap Save to apply it.`);
  };

  };
  return h('main', { class: 'stack', style: 'padding-bottom:24px' }, backLink(all ? 'Settings' : who, done),
    screenTitle(had ? 'Change the approval PIN' : 'Set an approval PIN', `For ${who}`),
    h('p', { class: 'hint' }, 'When you\'re with someone who wants a site, you can type this PIN on their phone to approve their request there and then, ' +
      'instead of answering it here. It only approves requests: it doesn\'t open this admin page, and it can\'t open sites on the adult, gambling or malware lists (only you can, with Approve anyway). A 6-digit PIN is best.'),

const MEDIA_T = ['media', 'photos', 'videos', 'sound'];   // temporary access that turns photos, videos or sound on
function tempScreen() {
  const sub = S.sub;
  sub.what = sub.what || 'site'; sub.mode = sub.mode || 'clock';
  const addr = h('input', { class: 'inp', id: 'tAddr', value: sub.entry || '', placeholder: 'e.g. coolmathgames.com', autocapitalize: 'off', spellcheck: 'false', oninput: e => { sub.entry = e.target.value; } });
  const len = h('div', { class: 'flabel', id: 'tLen' });
  const host = h('div', { 'data-sync': '' });
  const picker = makePicker(host, sub.minutes || 30, m => { sub.minutes = m; len.textContent = `How long: ${fmtMin(m)}`; });
  host._picker = picker;
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'What to open' },
    [['site', 'Whole site'], ['page', 'One page'], ['media', 'Photos/videos']].map(([v, t]) => {
      const on = v === 'media' ? MEDIA_T.includes(sub.what) : sub.what === v;
      return h('button', { type: 'button', 'aria-pressed': String(on), onclick: () => { if (!(v === 'media' && on)) { sub.what = v; render(); } } }, t);
    }));
  // Photos and videos back on for a while: which of them.
  const seg2 = MEDIA_T.includes(sub.what) ? h('div', { class: 'seg', role: 'group', 'aria-label': 'Which' },
    [['photos', 'Photos'], ['videos', 'Videos'], ['sound', 'Sound'], ['media', 'All']].map(([v, t]) =>
      h('button', { type: 'button', 'aria-pressed': String(sub.what === v), onclick: () => { sub.what = v; render(); } }, t))) : null;
  const radio = (v, t, s) => h('label', { class: 'radio' }, h('input', { type: 'radio', name: 'tMode', value: v, checked: sub.mode === v, onchange: () => { sub.mode = v; } }),
    h('span', null, h('b', { style: 'font-weight:600' }, t), h('span', { class: 'small muted', style: 'display:block' }, s)));
  const add = () => {
    const raw = (sub.entry || '').trim();
    const entry = sub.what === 'page' || (MEDIA_T.includes(sub.what) && hasPath(raw)) ? pageKey(raw) : normalize(raw);
    if (!entry) return say(sub.what === 'page' ? 'Type the page address, e.g. youtube.com/watch?v=abc' : 'Type a website address.', true);
    if (sub.what === 'page' && !hasPath(raw)) return say('For One page, type the full page address.', true);
    const minutes = picker.get();
    if (!minutes) return say('Choose how long on the wheels.', true);
    S.L.temporary = S.L.temporary.filter(t => !(t.what === sub.what && t.entry === entry));
    S.L.temporary.push({ id: 't' + Date.now().toString(36), what: sub.what, entry, mode: sub.mode, minutes, from: new Date().toISOString() });
    markList(); back();
    say(`${entry}: ${fmtMin(minutes)}${sub.mode === 'use' ? ' of use' : ''}. Tap Save to apply it.`);
  };
  return h('main', { class: 'stack', style: 'padding-bottom:24px' },

    h('div', { class: 'field' }, h('label', { for: 'tAddr' }, sub.what === 'page' ? 'Page address' : 'Site or page'), addr),

// ---------- always blocked / no photos on pages / never block (one address per line) ----------
// Embedded content allowed on a site (the list's "embeds"): content from these sites may show inside that
// site's pages, like a video or a map. Usually approved from a request; can be added or removed here.
function embedsScreen() {
  const L = S.L;
  const E = (L.extra && L.extra.embeds && typeof L.extra.embeds === 'object') ? L.extra.embeds : {};
  const save = next => {
    const clean = {};
    Object.keys(next).sort().forEach(k => { if (next[k] && next[k].length) clean[k] = [...new Set(next[k])].sort(); });
    L.extra = { ...(L.extra || {}) };
    if (Object.keys(clean).length) L.extra.embeds = clean; else delete L.extra.embeds;
    markList(); render();
  };
  const rows = [];
  Object.keys(E).sort().forEach(site => (E[site] || []).forEach(from => rows.push(
    h('div', { class: 'row' }, h('span', { class: 'ic' }, icon('link', 20)),
      h('span', { class: 'grow' }, h('span', { style: 'font-weight:600' }, from), h('span', { class: 'dom' }, `inside ${site}`)),
      h('button', { type: 'button', class: 'btn d sm', 'aria-label': `Remove ${from} on ${site}`, onclick: () => {
        const next = { ...E, [site]: (E[site] || []).filter(x => x !== from) };
        save(next); say(`Removed ${from} on ${site}. Tap Save to apply it.`);
      } }, 'Remove')))));
  const site = h('input', { class: 'inp', id: 'emSite', placeholder: 'Site, e.g. bbc.co.uk', autocomplete: 'off' });
  const from = h('input', { class: 'inp', id: 'emFrom', placeholder: 'Content from, e.g. player.vimeo.com', autocomplete: 'off' });
  const add = () => {
    const s1 = (normalize(site.value) || '').replace(/^(www|m)\./, ''), f1 = (normalize(from.value) || '').replace(/^www\./, '');
    if (!s1 || !f1 || hasPath(s1) || hasPath(f1)) return say('Type two site addresses, e.g. bbc.co.uk and player.vimeo.com.', true);
    save({ ...E, [s1]: [...(E[s1] || []), f1] }); say(`Content from ${f1} can show on ${s1} once you tap Save.`);
  };
  return h('main', { class: 'stack', style: 'padding-bottom:24px' }, backLink('Sites'),
    screenTitle('Embedded content allowed', `In ${listLabel(S.current)}`),
    h('p', { class: 'hint' }, 'Content from these sites (like a video or a map) may show inside the site named under it, but only there: the site itself doesn\'t open. ' +
      'Phones ask for this when part of a page was blocked. For a site you trust completely, use its Allow content embedded from other sites switch instead.'),
    rows.length ? h('div', { class: 'group' }, rows) : h('div', { class: 'card empty' }, h('b', null, 'Nothing yet'), 'Approved requests for blocked parts of pages appear here.'),
    h('div', { class: 'card stack', style: 'gap:10px' }, h('b', null, 'Add one'), site, from,
      h('button', { type: 'button', class: 'btn s', id: 'emAdd', onclick: add }, 'Add')));
}

function linesScreen({ backTo, title, sub, hint, value, placeholder, check, apply, id }) {
  const ta = h('textarea', { class: 'inp', id, spellcheck: 'false', autocapitalize: 'off', placeholder, value });
  const done = () => {
    const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
    const bad = lines.filter(l => !check(l));
    if (bad.length) { ta.classList.add('bad'); return say(`These don't look like website addresses: ${bad.join(', ')}`, true); }
    apply(lines); back();
  };
  return h('main', { class: 'stack', style: 'padding-bottom:24px' }, backLink(backTo), screenTitle(title, sub),
    h('p', { class: 'hint' }, hint), ta, h('button', { type: 'button', class: 'btn p wide', id: id + 'Done', onclick: done }, 'Done'));
}

  hint: 'Parts of allowed sites to keep blocked, one per line: a site like maps.google.com, or a single page like en.wikipedia.org/wiki/Fortnite.',

function noMediaScreen() {
  const L = S.L;

// ---------- import ----------
function importScreen() {
  const ta = h('textarea', { class: 'inp', id: 'bulkText', spellcheck: 'false', autocapitalize: 'off', placeholder: 'domain\tname\twikipedia.org\tWikipedia' });
  const file = h('input', { type: 'file', id: 'bulkFile', accept: '.csv,.tsv,.txt,.xlsx,.xls,.ods' });
  const mode = v => h('label', { class: 'radio' }, h('input', { type: 'radio', name: 'bulkMode', value: v, checked: v === 'merge' }),
    h('span', null, h('b', { style: 'font-weight:600' }, v === 'merge' ? 'Add to the list' : 'Replace the list'),
      h('span', { class: 'small muted', style: 'display:block' }, v === 'merge' ? 'Sites already on it are updated.' : 'Sites not in the spreadsheet are removed.')));
  const run = async () => {
    try {
      let rows;
      const f = file.files[0];
      if (f && /\.(xlsx|xls|ods)$/i.test(f.name)) {
        await loadSheetJs();
        const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      } else if (f) rows = parseDelimited((await f.text()).replace(/^\ufeff/, ''));
      else rows = parseDelimited(ta.value);
      const { sites, bad } = rowsToSites(rows);
      if (!sites.length) return say(bad.length ? `No website addresses found. Not understood: ${bad.slice(0, 5).join(', ')}` : 'Paste some rows or choose a file first.', true);
      const replace = document.querySelector('input[name=bulkMode]:checked').value === 'replace';
      if (replace) S.L.sites = [];
      let added = 0, updated = 0;
      for (const s of sites) {
        const i = S.L.sites.findIndex(x => normalize(x.domain) === s.domain);
        if (i >= 0) { S.L.sites[i] = { ...S.L.sites[i], ...s, passThrough: S.L.sites[i].passThrough }; updated++; } else { S.L.sites.push(s); added++; }
      }
      markList(); back();
      say(`${plural(added, 'site')} added${updated ? `, ${updated} updated` : ''}${bad.length ? `. Skipped: ${bad.slice(0, 5).join(', ')}` : ''}. Check them, then tap Save.`);
    } catch (e) { say(e.message, true); }
  };
  return h('main', { class: 'stack', style: 'padding-bottom:24px' }, backLink('Sites'),
    screenTitle('Import from a spreadsheet', `Into ${listLabel(S.current)}`),
    h('p', { class: 'hint' }, 'Paste cells from Excel or Google Sheets, or choose a file. Columns: domain, name, home page, tile opens, subdomains, only these pages, no photos or videos. Only the domain is needed.'),
    ta, h('div', { class: 'field' }, h('label', { for: 'bulkFile' }, 'Or choose a file (.csv, .xlsx)'), file),
    h('div', { class: 'group' }, mode('merge'), mode('replace')),
    h('button', { type: 'button', class: 'btn p wide', id: 'bulkImport', onclick: run }, 'Import'),
    INAPP ? h('p', { class: 'hint' }, 'To download the list or a template, use the admin page on a computer.') :
    h('div', { class: 'acts', style: 'justify-content:center' },
      h('button', { type: 'button', class: 'btn s sm', onclick: exportCsv }, 'Download this list as a spreadsheet'),
      h('a', { class: 'btn s sm', href: 'sites-template.csv', download: '' }, 'Download a template')));
}

    [['', 'The usual (see Settings)'], ['own', 'Its own list'], ...S.lists.map(n => [n, `The ${listLabel(n)} list`])].map(([v, t]) => h('option', { value: v }, t)));

  const pinMode = d.approvalPin === 'none' ? 'none' : (d.approvalPin && typeof d.approvalPin === 'object') ? 'own' : '';
  const pinSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Approval PIN' },
    [['', 'Usual'], ['own', 'Own PIN'], ['none', 'None']].map(([v, t]) => h('button', { type: 'button', 'aria-pressed': String(pinMode === v),

        if (v === 'none') d.approvalPin = 'none'; else delete d.approvalPin;

      onclick: () => { if (v) d.adblock = v; else delete d.adblock; markDevices(); render(); } }, t)));
  // Block: keep it listed but allow nothing. Its lists are set aside, and Unblock gives them back.

}
function archivedScreen() {
  const entries = Object.entries(S.D.archived || {});
  const phones = Object.entries(S.D.devices);
  const cards = entries.map(([aid, a]) => {
    const give = h('select', { class: 'inp', 'aria-label': 'Give to phone', style: 'min-height:44px' }, h('option', { value: '' }, 'Give to another phone…'),
      phones.map(([pid, p]) => h('option', { value: pid }, `${p.name || 'No name'} (${pid})`)));
    give.onchange = () => { if (give.value) bringBack(aid, give.value); };
    return h('div', { class: 'card', 'data-archived': aid },
      h('div', null, h('b', { style: 'font-size:17px' }, a.name || `${a.model || 'Phone'} (no name)`),
        h('div', { class: 'muted small mono' }, [aid, a.model, a.lastSeen ? `last seen ${String(a.lastSeen).slice(0, 10)}` : null].filter(Boolean).join(' · '))),
      h('div', { class: 'chips' }, (a.lists || []).map(l => chip(listLabel(l), (a.archivedLists || []).includes(l) ? 'amber' : 'teal'))),
      h('div', { class: 'acts' }, h('button', { type: 'button', class: 'btn p grow', onclick: () => bringBack(aid, aid) }, 'Restore'),
        h('button', { type: 'button', class: 'btn d', onclick: () => deleteArchived(aid) }, 'Delete for good')),
      phones.length ? give : null);

  return h('main', { class: 'stack', style: 'padding-bottom:24px' }, backLink('Phones'),
    screenTitle('Archived phones', 'Phones that stopped checking in. Their own lists are kept, not deleted.'),
    entries.length ? cards : h('div', { class: 'card empty' }, h('b', null, 'None'), 'Phones not seen for a while are archived here automatically.'),
    h('p', { class: 'hint' }, 'After a factory reset a phone gets a new ID and appears as a new phone. Use Give to another phone to hand it its old name and lists.'));
}
// Archive a phone now, the same way the daily check does after it's unused for a while: its own lists
// (ones no other phone uses) move to docs/lists/archive/, and it moves to Archived phones.
const allListsOf = d => [...new Set([...(d.lists || []), ...(d.blockedLists || [])])];
async function archiveNow(id) {
  if (S.devDirty || S.listDirty) return say('Save or undo your changes first.', true);
  const d = S.D.devices[id], who = d.name || id;
  const own = allListsOf(d).filter(l => l !== 'public' && !S.D.default.includes(l) &&
    !Object.entries(S.D.devices).some(([other, o]) => other !== id && allListsOf(o).includes(l)));
  if (!confirm(`Archive ${who} now?` + (own.length ? ` Its own list (${own.map(listLabel).join(', ')}) is archived with it.` : '') +
    ' You can restore it from Archived phones.')) return;
  try {
    const moved = [];
    for (const l of own) {
      if (await moveFile(`docs/lists/${l}.json`, `docs/lists/archive/${l}.json`, `Archive list ${l} with phone ${who}`)) moved.push(l);
    }
    S.lists = S.lists.filter(l => !moved.includes(l));
    S.D.archived[id] = { ...d, archivedOn: new Date().toISOString().slice(0, 10), archivedLists: moved };
    delete S.D.devices[id];
    S.devicesSha = await putJson('devices.json', S.D, S.devicesSha, `Archive phone ${who}`);
    if (moved.includes(S.current)) await openList('public');
    back(); say(`${who} archived.`);
  } catch (e) { say(e.message, true); }
}

async function bringBack(fromId, toId) {
  if (S.devDirty) return say('Save or undo your phone changes first.', true);
  const a = S.D.archived[fromId], to = S.D.devices[toId], who = a.name || fromId;
  if (!confirm(fromId === toId ? `Restore ${who} with its lists?` : `Give ${who}'s name and lists to ${to.name || to.model || toId}?`)) return render();
  try {
    const renamed = {};
    for (const l of a.archivedLists || []) {
      let name = l, n = 2;
      while (S.lists.includes(name)) name = `${l}-${n++}`;
      if (await moveFile(`docs/lists/archive/${l}.json`, `docs/lists/${name}.json`, `Restore list ${name} from the archive`)) { S.lists.push(name); renamed[l] = name; }
    }
    const restoredLists = (a.lists || []).map(l => renamed[l] || l).filter(l => S.lists.includes(l));
    const { lastSeen, archivedOn, archivedLists, ...kept } = a;
    const target = to || { lists: [], registered: new Date().toISOString().slice(0, 10) };
    S.D.devices[toId] = { ...kept, ...target, name: target.name || a.name || '', model: target.model || a.model,
      lists: [...new Set([...(target.lists || []), ...restoredLists])],
      ...(fromId !== toId ? { previousIds: [...(a.previousIds || []), fromId] } : {}) };
    if (!target.requestsTo && a.requestsTo) S.D.devices[toId].requestsTo = a.requestsTo;
    if (Array.isArray(a.blockedLists) && fromId === toId) S.D.devices[toId].blockedLists = a.blockedLists.map(l => renamed[l] || l).filter(l => S.lists.includes(l));
    delete S.D.archived[fromId];
    S.devicesSha = await putJson('devices.json', S.D, S.devicesSha, `Restore phone ${who}`);
    render();
    say(`${who} restored. Lists: ${S.D.devices[toId].lists.map(listLabel).join(', ') || 'none'}.`);
  } catch (e) { say(e.message, true); }
}
async function deleteArchived(id) {
  if (S.devDirty) return say('Save or undo your phone changes first.', true);
  const a = S.D.archived[id];
  const lost = a.archivedLists || [];
  if (!confirm(`Delete ${a.name || id} for good?` + (lost.length ? ` Its archived lists (${lost.join(', ')}) are deleted too.` : ''))) return;
  try {
    for (const l of lost) {
      const f = await getRaw(`docs/lists/archive/${l}.json`);
      if (f) await deleteFile(`docs/lists/archive/${l}.json`, f.sha, `Delete archived list ${l}`);
    }
    delete S.D.archived[id];
    S.devicesSha = await putJson('devices.json', S.D, S.devicesSha, `Delete archived phone ${a.name || id}`);
    render(); say(`${a.name || id} deleted.`);
  } catch (e) { say(e.message, true); }
}

      })),
