<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  /* The app's fonts (packed in at build time). If they're missing, the phone's own font is used. */
  @font-face { font-family: 'Figtree'; src: url('fonts/Figtree.ttf') format('truetype'); font-weight: 300 900; font-display: swap; }
  @font-face { font-family: 'Bricolage Grotesque'; src: url('fonts/BricolageGrotesque.ttf') format('truetype'); font-weight: 200 800; font-display: swap; }
  :root { --bg: #F5F3EE; --ink: #1C2B2D; --muted: #5B6B69; --tile: #FFFFFF; --edge: #E7E3DB; --accent: #1F5F55;
    --accent-text: #1F5F55; --soft: #E1EEEA; }
  /* Dark (the app says which: data-theme on <html>) */
  :root[data-theme="dark"] { --bg: #1F2B2C; --ink: #ECF2F0; --muted: #AEBFBB; --tile: #304041; --edge: #3D4E4F;
    --accent: #3D8F7E; --accent-text: #9BE3C2; --soft: #2C4A44; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 Figtree, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.4rem 1rem 3rem; }
  .hello { font: 700 1.35rem/1.2 'Bricolage Grotesque', Figtree, sans-serif; margin: 0 .25rem 1.1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 1.3rem .5rem; }
  a.tile { display: flex; flex-direction: column; align-items: center; gap: .5rem; text-decoration: none; color: inherit; }
  .icon { position: relative; width: 60px; height: 60px; border-radius: 18px; background: var(--tile); border: 1px solid var(--edge);
    display: grid; place-items: center; box-shadow: 0 1px 2px rgba(28, 43, 45, .06); }
  .icon img { width: 32px; height: 32px; border-radius: 6px; }
  .icon .letter { font: 700 1.5rem/1 'Bricolage Grotesque', Figtree, sans-serif; color: var(--accent-text); }
  a.tile:active .icon { transform: scale(.94); }
  a.tile:focus-visible .icon { outline: 3px solid #7FD1A8; outline-offset: 2px; }
  .badge { position: absolute; right: -8px; top: -7px; background: var(--accent); color: #fff; font-size: .64rem;
    font-weight: 700; padding: 2px 6px; border-radius: 9px; white-space: nowrap; }
  .name { font-size: .8rem; font-weight: 600; text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  a.tile { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  a.tile.held .icon { transform: scale(1.1); box-shadow: 0 10px 24px rgba(0, 0, 0, .22); transition: transform .12s; }
  a.tile.gap { opacity: .25; }
  .ghost { position: fixed; z-index: 10; pointer-events: none; transform: translate(-50%, -50%) rotate(-4deg) scale(1.12);
    display: flex; flex-direction: column; align-items: center; gap: .5rem; width: 84px; }
  .ghost .icon { box-shadow: 0 14px 30px rgba(0, 0, 0, .28); }
  .shade { position: fixed; inset: 0; z-index: 20; background: rgba(16, 28, 29, .2); }
  .menu { position: fixed; z-index: 21; left: 50%; transform: translateX(-50%); width: min(300px, calc(100vw - 32px));
    background: var(--tile); color: var(--ink); border-radius: 16px; box-shadow: 0 14px 36px rgba(0, 0, 0, .25); overflow: hidden; }
  .menu .head { padding: .8rem 1rem; font-weight: 700; border-bottom: 1px solid var(--edge); }
  .menu a { display: flex; gap: .7rem; align-items: flex-start; padding: .85rem 1rem; color: var(--ink); text-decoration: none;
    min-height: 48px; box-sizing: border-box; }
  .menu a:active { background: var(--soft); }
  .menu a svg { flex: none; margin-top: 2px; color: var(--accent-text); }
  .menu .sub { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .menu .tip { padding: .6rem 1rem; font-size: .8rem; color: var(--muted); background: var(--bg); }
  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem 1rem; }
  .empty h1 { color: var(--ink); font: 700 1.35rem/1.25 'Bricolage Grotesque', Figtree, sans-serif; margin: 0 0 .4rem; }
  .ask { display: flex; align-items: center; justify-content: center; gap: .45rem; margin: 2.2rem auto 0; width: max-content;
    background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; padding: .8rem 1.3rem;
    border-radius: 999px; min-height: 48px; }
  .ask svg { flex: none; }
  .ask:active { filter: brightness(.9); }
  /* Small screens (e.g. 2.8-inch phones, about 240px wide): three smaller tiles per row. */
  @media (max-width: 340px) {
    main { padding: .9rem .5rem 2rem; }
    .hello { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: .9rem .25rem; }
    .icon { width: 48px; height: 48px; border-radius: 14px; }
    .icon img { width: 24px; height: 24px; }
    .icon .letter { font-size: 1.2rem; }
    .name { font-size: .72rem; }
    .empty { padding: 1.5rem .5rem .5rem; }
    .ask { margin-top: 1.4rem; padding: .7rem 1.1rem; font-size: .9rem; }
  }
  /* Text search (when it's on for this phone): words only, safe search on. */
  .search { display: flex; align-items: center; gap: .6rem; min-height: 52px; border-radius: 26px; background: var(--tile);
    border: 1px solid var(--edge); padding: 0 1.1rem; margin: 0 0 1.4rem; }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 16px Figtree, system-ui, sans-serif; min-height: 48px; }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); }
  a.tile.opening { opacity: .6; transform: scale(.96); transition: opacity .15s, transform .15s; position: relative; }
  a.tile.opening::after { content: ""; position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--accent, #1F5F55); border-right-color: transparent; animation: wlb-spin .7s linear infinite; }
  @keyframes wlb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { a.tile.opening::after { animation: none; } }
</style>
</head>
<body>
<main>
  <form class="search" id="search" action="/search/" method="get" role="search" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input type="search" name="q" placeholder="Search" aria-label="Search" autocomplete="off" enterkeyhint="search">
  </form>
  <h1 class="hello" id="hello">Your sites</h1>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><h1 id="emptyTitle"></h1><p id="emptyText"></p></div>
  <a class="ask" id="ask" href="wlb://request?action=allow" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ask for a new site</a>
</main>
<script>
  function tile(t) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = t.url;
    a.dataset.domain = t.domain;
    a.dataset.name = t.name || t.domain;
    if (t.last) { a.dataset.last = t.last.url; a.dataset.lastTitle = t.last.title || ''; }
    const icon = document.createElement('span');
    icon.className = 'icon';
    const img = document.createElement('img');
    let host = t.domain;
    try { host = new URL(t.url).hostname; } catch (e) {}
    img.alt = '';
    img.loading = 'lazy';
    img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(host);
    img.onerror = () => {                       // no icon available: show the first letter
      const l = document.createElement('span');
      l.className = 'letter';
      l.textContent = (t.name || t.domain).trim().charAt(0).toUpperCase();
      img.replaceWith(l);
    };
    icon.append(img);
    if (t.temp) {                               // open for a while: show the time left
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = '\u23F1 ' + t.temp;
      icon.append(b);
    }
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = t.name;
    a.append(icon, name);
    return a;
  }

  // The tiles are checked again every 20 seconds (and when the app comes back to the front), so a
  // temporary site's tile disappears when its time is up, its time left counts down, and newly
  // approved sites appear. Only changes are redrawn, so the tiles don't flicker.
  let shown = '';
  const keyOf = t => `${t.url}|${t.name}`;
  function render(d) {
    if (press && press.dragging) return;          // not while a tile is being moved
    const keys = d.tiles.map(keyOf).join('\n');
    if (keys !== shown) {                        // tiles added or removed: redraw them
      grid.replaceChildren(...d.tiles.map(tile));
      shown = keys;
    } else {                                     // same tiles: just update the time left
      d.tiles.forEach((t, i) => {
        const b = grid.children[i] && grid.children[i].querySelector('.badge');
        if (b && t.temp) b.textContent = '\u23F1 ' + t.temp;
      });
    }
    const empty = document.getElementById('empty');
    empty.hidden = d.tiles.length > 0;
    document.getElementById('hello').hidden = !d.tiles.length;
    document.getElementById('search').hidden = !d.search;        // text search: only when it's on for this phone
    if (!d.tiles.length) {
      document.getElementById('emptyTitle').textContent = d.settingUp ? 'Setting up this phone…'
        : !d.loaded ? 'Loading the list of sites' : d.siteCount ? 'No sites on the home page' : 'No sites are allowed yet';
      document.getElementById('emptyText').textContent = d.settingUp
        ? 'This takes a minute or two the first time, and needs an internet connection. Its sites appear here by themselves.'
        : !d.loaded ? 'This needs an internet connection the first time.'
        : d.siteCount ? 'None of your sites have a tile yet. Ask for a site below.' : 'Ask for a site below.';
    }
    document.getElementById('ask').hidden = !d.canRequest || !!d.settingUp;   // asking waits until it's set up
  }
  // ---------- holding a tile: a menu (let go), or drag it to move it ----------
  const grid = document.getElementById('grid');
  let press = null;              // the tile being held: { a, x, y, held, dragging, ghost }
  let swallowClick = false;      // the tap that ends a hold doesn't also open the site
  const HOLD_MS = 450, MOVE = 10;

  function point(e) { const t = e.touches ? e.touches[0] || e.changedTouches[0] : e; return { x: t.clientX, y: t.clientY }; }
  function start(e) {
    const a = e.target.closest('a.tile');
    if (!a || document.querySelector('.menu')) return;
    closeMenu();
    const p = point(e);
    press = { a, x: p.x, y: p.y, held: false, dragging: false, ghost: null };
    press.timer = setTimeout(() => {
      if (!press) return;
      press.held = true;
      if (navigator.vibrate) navigator.vibrate(15);
      showMenu(a);                     // straight away, while the finger is still down
    }, HOLD_MS);
  }
  function move(e) {
    if (!press) return;
    const p = point(e);
    const moved = Math.hypot(p.x - press.x, p.y - press.y);
    if (!press.held) { if (moved > MOVE) cancel(); return; }      // a swipe before the hold: it's a scroll
    if (e.cancelable) e.preventDefault();                          // held: the page doesn't scroll
    if (!press.dragging && moved > MOVE) {
      closeMenu();                     // moving: it's a drag, not the menu
      press.dragging = true;
      press.ghost = press.a.cloneNode(true);
      press.ghost.className = 'ghost';
      document.body.append(press.ghost);
      press.a.classList.remove('held');
      press.a.classList.add('gap');
    }
    if (!press.dragging) return;
    press.ghost.style.left = p.x + 'px';
    press.ghost.style.top = p.y + 'px';
    const over = document.elementFromPoint(p.x, p.y);
    const target = over && over.closest('a.tile');
    if (target && target !== press.a && target.parentNode === grid) {
      const tiles = [...grid.children];
      grid.insertBefore(press.a, tiles.indexOf(target) > tiles.indexOf(press.a) ? target.nextSibling : target);
    }
  }
  function end(e) {
    if (!press) return;
    clearTimeout(press.timer);
    const p = press;
    press = null;
    if (p.dragging) {
      p.ghost.remove();
      p.a.classList.remove('gap');
      swallowClick = true;
      // Keep the new order (on this phone).
      const keys = [...grid.children].map(x => x.dataset.domain).filter(Boolean);
      location.href = 'wlb://tile-order?keys=' + encodeURIComponent(keys.join(','));
    } else if (p.held) {
      swallowClick = true;             // let go without moving: the menu stays open
    }
    if (e && (p.held || p.dragging) && e.cancelable) e.preventDefault();
  }
  function cancel() {
    if (!press) return;
    clearTimeout(press.timer);
    press.a.classList.remove('held', 'gap');
    if (press.ghost) press.ghost.remove();
    press = null;
  }
  grid.addEventListener('touchstart', start, { passive: true });
  grid.addEventListener('touchmove', move, { passive: false });
  grid.addEventListener('touchend', end, { passive: false });
  grid.addEventListener('touchcancel', cancel);
  grid.addEventListener('mousedown', e => { if (e.button === 0) start(e); });
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end);
  grid.addEventListener('contextmenu', e => e.preventDefault());
  grid.addEventListener('click', e => { if (swallowClick) { e.preventDefault(); e.stopPropagation(); swallowClick = false; } }, true);
  // A tap that opens a site: the tile shows it at once (dimmed, with a small spinner) while the site opens.
  grid.addEventListener('click', e => {
    const a = e.target.closest('a.tile');
    if (a && !e.defaultPrevented) a.classList.add('opening');
  });
  window.addEventListener('pageshow', () => document.querySelectorAll('a.tile.opening').forEach(t => t.classList.remove('opening')));

  // The menu: open the site's home page, or where it was left off.
  const ICON_HOME = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>';
  const ICON_LAST = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
  function showMenu(a) {
    const shade = document.createElement('div');
    shade.className = 'shade';
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.setAttribute('role', 'menu');
    const head = document.createElement('div');
    head.className = 'head';
    head.textContent = a.dataset.name;
    const item = (href, icon, text, sub) => {
      const link = document.createElement('a');
      link.href = href;
      link.setAttribute('role', 'menuitem');
      link.innerHTML = icon;
      const words = document.createElement('span');
      words.textContent = text;
      if (sub) { const s = document.createElement('span'); s.className = 'sub'; s.textContent = sub; words.append(s); }
      link.append(words);
      return link;
    };
    menu.append(head, item(a.href, ICON_HOME, 'Open its home page'));
    if (a.dataset.last) menu.append(item(a.dataset.last, ICON_LAST, 'Open where you left off', a.dataset.lastTitle || a.dataset.last));
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = 'Or hold it and drag to move it';
    menu.append(tip);
    const r = a.getBoundingClientRect();
    document.body.append(shade, menu);
    const below = r.bottom + 8, h = menu.offsetHeight;
    menu.style.top = Math.max(8, below + h > window.innerHeight - 8 ? r.top - h - 8 : below) + 'px';
    shade.addEventListener('click', closeMenu);
    menu.addEventListener('click', closeMenu);
  }
  function closeMenu() { document.querySelectorAll('.shade, .menu').forEach(x => x.remove()); }

  function load() {
    fetch('sites.json', { cache: 'no-store' }).then(r => r.json()).then(render).catch(() => {});
  }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
