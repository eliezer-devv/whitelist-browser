name: Publish list

# Publishes the docs/ folder (the list, admin page and status page) to GitHub Pages.
# Runs when docs/ changes, and after a request is approved.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A running publish always finishes; if several more arrive meanwhile, only
# the newest waits (it includes all their changes, since it reads the latest files when it starts).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      # The admin page sends its (sealed) commands with the requests token, the same one built into the app:
      # filled in here, in the published copy only (stored reversed, never committed).
      # Two admin pages: the released one at admin.html (docs/admin-live.html, saved by "Release to everyone"), and
      # the newest, still being tested, at admin-test.html (docs/admin.html). Until the first release, just one.
      - name: The released admin page, and the test one
        run: |
          if [ -f docs/admin-live.html ]; then
            mv docs/admin.html docs/admin-test.html
            mv docs/admin-live.html docs/admin.html
          fi
      - name: Give the admin page the requests token
        env:
          REQUESTS_TOKEN: ${{ secrets.REQUESTS_TOKEN }}
        run: |
          rev="$(printf '%s' "$REQUESTS_TOKEN" | tr -d '[:space:]' | rev)"
          # (admin-test.html only once something has been released to everyone)
          for f in docs/admin.html docs/admin-test.html; do
            if [ -f "$f" ]; then sed -i "s/__REQUESTS_TOKEN_REV__/${rev}/" "$f"; fi
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      # GitHub sometimes can't find the just-uploaded files for a few seconds ("No artifacts named github-pages"):
      # then it waits and tries again, twice, before giving up.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait a moment (GitHub didn't find the files yet)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait a little longer
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
