name: Publish list

# Publishes the docs/ folder (the list, admin page and status page) to GitHub Pages.
# Runs when docs/ changes, and after a request is approved.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A running publish always finishes; if several more arrive meanwhile, only
# the newest waits (it includes all their changes, since it reads the latest files when it starts).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
