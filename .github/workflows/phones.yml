name: Daily phone check

# Once a day: phones that haven't checked in for a while (see "Archive phones not seen for" on the
# admin page) are archived, and archived phones that are being used again are restored.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # update devices.json, move lists to and from the archive
  issues: write     # read check-ins, send the notification
  actions: write    # start "Publish list"

# No concurrency group: GitHub would cancel waiting runs when several arrive together.
# Instead, every save retries on top of the latest version (see saveWithRetry).

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPhones } = require('./.github/scripts/handle-request.js');
            await checkPhones({ github, context, core, exec });
